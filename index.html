<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cute Quiz Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="quiz-container">
    <div class="quiz-card">

      <div class="quiz-header">
        <p class="small-title">✨ Little Brain Break</p>
        <h1>Cute Quiz Game 🎀</h1>
        <p class="subtitle">Test your knowledge and have some fun!</p>
      </div>

      <div class="progress-section">
        <div class="progress-text">
          <span id="question-number">Question 1 of 5</span>
          <span id="score-text">Score: 0</span>
        </div>

        <div class="progress-bar">
          <div id="progress" class="progress"></div>
        </div>
      </div>

      <section id="quiz-section">
        <h2 id="question">Question will appear here</h2>

        <div id="options" class="options"></div>

        <p id="feedback" class="feedback"></p>

        <button id="next-button" class="next-button">Next Question →</button>
      </section>

      <section id="result-section" class="result-section hidden">
        <div class="result-emoji">🎉</div>
        <h2>Quiz Completed!</h2>
        <p id="result-message"></p>
        <p id="final-score"></p>
        <button id="restart-button" class="restart-button">
          Play Again 🔄
        </button>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
